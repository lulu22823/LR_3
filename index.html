<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Лабораторна робота №3.</h2>

    <div class="task task1">
        <h3>Завдання 1</h3>
        <button id="task1_btn">Виконати завдання</button>
        <div id="task1_out" class="output"></div>
    </div>

    <div class="task task2">
        <h3>Завдання 2</h3>
        <button id="task2_btn">Виконати завдання</button>
        <div id="task2_out" class="output"></div>
    </div>

    <div class="task task3">
        <h3>Завдання 3</h3>
        <button id="task3_btn">Виконати завдання</button>
        <div id="task3_out" class="output"></div>
    </div>

    <div class="task task4">
        <h3>Завдання 4</h3>
        <button id="task4_btn">Запустити таймер</button>
        <div id="task4_out" class="output"></div>
    </div>

    <div class="task task5">
        <h3>Завдання 5</h3>
        <button id="task5_btn">Виконати завдання</button>
        <div id="task5_out" class="output"></div>
    </div>

    <div class="task task6">
        <h3>Завдання 6</h3>
        <button id="task6_btn">Клікнути (+1)</button>
        <button id="task6_reset">Скинути</button>
        <div id="task6_out" class="output"></div>
    </div>

    <div class="task task7">
        <h3>Завдання 7</h3>
        <button id="task7_init">Задати межі</button>
        <button id="next" disabled>Next number</button>
        <div id="out" class="output"></div>
    </div>

    <div class="task task8">
        <h3>Завдання 8</h3>
        <button id="task8_btn">Зібрати пароль</button>
        <div id="task8_out" class="output"></div>
    </div>

    <div class="task task9">
        <h3>Завдання 9</h3>
        <button id="task9_btn">Почати діалог</button>
        <div id="task9_out" class="output"></div>
    </div>

    <div class="task task10">
        <h3>Завдання 10</h3>
        <button id="task10_setName">Задати ім'я</button>
        <button id="hello_lost">Без прив'язки (this втрачено)</button>
        <button id="hello">Say (з .bind)</button>
        <div id="task10_out" class="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
